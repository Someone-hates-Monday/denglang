# Local Docker profiles (ports match docker-compose)
# Start: --spring.profiles.active=local,secret
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/smart-street-light
    username: postgres

mqtt:
  broker-url: tcp://127.0.0.1:1883
  client-id: smart-light-server-local

streetlight:
  demo:
    mock-keepalive: false

greenhouse:
  sim:
    enabled: true
    interval-ms: 250
    day-compress-sec: 120
    publish-mqtt-telemetry: false
  control:
    command-timeout-sec: 30

llm:
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat
  temperature: 0.3
  max-tokens: 2048
  top-k: 4